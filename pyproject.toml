[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-viewer"
version = "0.1.0"
description = "A lightweight local Kafka message inspection tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kafka-python>=3.0.11,<4",
    "streamlit>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]
build = ["build>=1,<2"]
security = ["pip-audit>=2.9,<3"]

[project.scripts]
kafka-viewer-unsecured = "kafka_viewer.cli:main"

[tool.setuptools.packages.find]
include = ["kafka_viewer*"]