[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-viewer"
version = "0.4.0"
description = "A lightweight local Kafka message inspection tool"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Shashank Yadav", email = "shashankyadav.1299@gmail.com" },
]

dependencies = [
    "confluent-kafka[avro]>=2.8,<3",
    "cryptography>=50,<51",
    "kafka-python>=3.0.11,<4",
    "python-snappy>=0.6,<1",
    "python-dotenv>=1.2.2,<2",
    "streamlit>=1.35,<2",
    "defusedxml>=0.7.1,<0.8",
    "protobuf>=5.26.1,<8",
    "tzdata>=2024.1,<2028",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
]
build = [
    "build>=1,<2",
]
security = [
    "pip-audit>=2.9,<3",
]

[project.urls]
Homepage = "https://yshashanky.github.io/"
Repository = "https://github.com/yshashanky/kafka-viewer"
Issues = "https://github.com/yshashanky/kafka-viewer/issues"

[project.scripts]
kafka-viewer = "kafka_viewer.cli:main"
kafka-viewer-certify = "kafka_viewer.certification.cli:main"

[tool.setuptools.packages.find]
include = ["kafka_viewer*"]
